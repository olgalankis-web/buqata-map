<!--
  ===========================================================================
  נכנסים לבוקעתא — גרסה מחוברת ל-Google Sheets (חיה)
  ===========================================================================
  קובץ עצמאי אחד, מוכן להעלאה לכל אחסון סטטי (GitHub Pages, Netlify וכו').

  לפני שמעלים בפועל:
  1. קובץ הגיליון (עם שלוש הלשוניות: מקומות | קטגוריות | הגדרות) חייב להיות
     משותף כ"כל מי שיש לו את הקישור - צפייה":
     Share -> General access -> Anyone with the link -> Viewer.
     בלי זה הדף יקבל דף התחברות של גוגל במקום JSON, והנתונים לא ייטענו.
  2. מזהה הגיליון מוגדר למטה תחת SPREADSHEET_ID, ושמות שלוש הלשוניות תחת
     SHEET_NAMES. אם משנים את שמות הלשוניות בקובץ - צריך לעדכן גם כאן.
  1ב. מיקום מקום: אפשר להשתמש בעמודה אחת בשם "מיקום" בלשונית "מקומות", בפורמט
      "lat, lng" (בדיוק כמו שגוגל מפות נותן בהעתקה, למשל 32.05260885740614,
      34.756262289186914). אם העמודה הזו קיימת וממולאת - היא תמיד עדיפה.
      אם היא ריקה/לא קיימת בשורה מסוימת, הקוד ייפול חזרה לשתי העמודות הישנות
      "קו רוחב (lat)" ו"קו אורך (lng)". אפשר להשאיר את העמודות הישנות בגיליון
      בלי לפגוע בכלום.
  3. הדף קורא את הנתונים בזמן טעינה מהדפדפן של המבקר (לא בזמן build), אז
     כל שינוי בגיליון מופיע באתר החי מייד עם רענון הדף - בלי לגעת בקוד.
  4. הקובץ לא יעבוד אם פותחים אותו ישירות מהדיסק (file://) בגלל CORS -
     צריך לארח אותו על כתובת https אמיתית (GitHub Pages וכו').
  ===========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Sans+Hebrew:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

<style>
  :root{
    /* Palette from Ron's reference image: terracotta, sky, brick, sage,
       olive, deep (sampled directly from the swatches she sent). */
    --bg:#F3F1E4; --surface:#FDFCF6; --surface-raised:#FFFFFF;
    --ink:#262B18; --ink-soft:#585C42; --ink-faint:#8B8F74;
    --line:#E2DFC9; --line-strong:#D0CAAA;
    --terracotta:#DD6B38; --sky:#90B9C6; --brick:#5F2519;
    --sage:#C2C3A0; --olive:#535830; --deep:#262B18;
    --accent:var(--terracotta); --accent-ink:#FFFFFF;
    --shadow:0 12px 32px -12px rgba(38,43,24,0.28);
    --shadow-sm:0 2px 10px -4px rgba(38,43,24,0.25);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1C13; --surface:#232419; --surface-raised:#2B2C1F;
      --ink:#F1EEDF; --ink-soft:#C9C4A6; --ink-faint:#8F8A6E;
      --line:#3A3B29; --line-strong:#4A4B35;
      --terracotta:#E8835C; --sky:#A9CDD8; --brick:#9C5240;
      --sage:#D6D7B6; --olive:#7E8552; --deep:#F1EEDF;
      --accent:var(--terracotta); --accent-ink:#1B1C13;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1C13; --surface:#232419; --surface-raised:#2B2C1F;
    --ink:#F1EEDF; --ink-soft:#C9C4A6; --ink-faint:#8F8A6E;
    --line:#3A3B29; --line-strong:#4A4B35;
    --terracotta:#E8835C; --sky:#A9CDD8; --brick:#9C5240;
    --sage:#D6D7B6; --olive:#7E8552; --deep:#F1EEDF;
    --accent:var(--terracotta); --accent-ink:#1B1C13;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; background:var(--bg);}
  img{max-width:100%;}
  [hidden]{display:none !important;}

  #app{
    height:100%; min-height:100%; display:flex; flex-direction:column;
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans','IBM Plex Sans Hebrew','IBM Plex Sans Arabic',sans-serif;
    font-weight:500;
    overflow:hidden;
  }
  #app[dir="rtl"]{ font-family:'IBM Plex Sans Hebrew','IBM Plex Sans Arabic','IBM Plex Sans',sans-serif; }
  #app[lang="ar"]{ font-family:'IBM Plex Sans Arabic','IBM Plex Sans Hebrew','IBM Plex Sans',sans-serif; }

  /* One typeface family everywhere (medium for body text, semibold for
     headings/emphasis) instead of a separate serif display face. */
  h1,h2,h3,.display{
    font-weight:600; text-wrap:balance; margin:0;
  }

  button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  a{ color:inherit; }
  p{ margin:0; }

  /* All of our own overlay/floating UI (topbar, filters, status banner,
     backdrop, mobile card, language menu, intro modal) uses z-index values
     of 1000+ on purpose. Leaflet's own internal panes and controls use
     z-index up to 1000 (its zoom control is z-index:1000, its tile/overlay
     panes are 200-700), and since the map container here doesn't isolate
     its own stacking context, those values compete directly against ours
     in the page's global stacking order - so anything of ours below ~1000
     risks having real map tiles/controls painted on top of it once the
     map tiles actually load (this doesn't show up when testing against a
     blocked/offline map, only with real tile imagery loaded - found this
     the hard way, see the project notes). Keep every one of our overlay
     elements at 1000+ to stay safely above anything Leaflet can do. */

  .topbar{
    position:sticky; top:0; z-index:1030;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark{ flex:none; width:34px; height:34px; }
  .brand-mark img{ width:100%; height:100%; display:block; }
  .brand-text{ min-width:0; }
  .brand-title{ font-size:19px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-sub{
    font-size:12.5px; color:var(--ink-soft); line-height:1.3; margin-top:1px;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
    overflow:hidden;
  }
  .top-actions{ display:flex; align-items:center; gap:6px; flex:none; }
  .lang-switch{ position:relative; }
  .lang-menu{
    position:absolute; top:calc(100% + 8px); inset-inline-end:0; margin:0;
    background:var(--surface-raised); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:6px; display:flex; flex-direction:column; gap:2px;
    min-width:130px; z-index:1035; list-style:none;
  }
  .lang-menu[hidden]{ display:none; }
  .lang-menu button{ padding:9px 12px; border-radius:9px; font-size:15px; color:var(--ink-soft); text-align:start; width:100%; }
  .lang-menu button[aria-pressed="true"]{ background:var(--bg); color:var(--ink); font-weight:600; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--ink-soft); flex:none;
  }
  .icon-btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; }

  .filters{
    position:sticky; top:59px; z-index:1029;
    display:flex; flex-wrap:wrap; gap:8px; padding:10px 16px;
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .chip{
    flex:none; display:flex; align-items:center; gap:6px;
    padding:6px 11px; border-radius:999px; border:1px solid var(--line-strong);
    background:var(--surface); font-size:14px; color:var(--ink-soft); white-space:nowrap;
  }
  .chip svg{ width:18px; height:18px; stroke:var(--chip-color,currentColor); fill:none; stroke-width:1.9; }
  .chip[aria-pressed="true"]{ background:var(--chip-color); border-color:var(--chip-color); color:var(--chip-ink,#fff); }
  .chip[aria-pressed="true"] svg{ stroke:var(--chip-ink,#fff); }

  .layout{ position:relative; flex:1; min-height:0; display:flex; }
  .map-wrap{ position:relative; flex:1; min-width:0; }
  #leaflet-map{ position:absolute; inset:0; width:100%; height:100%; background:var(--bg); }

  /* One uniform accent color for every marker (not per-category anymore -
     keeps the map simple/legible against the gray basemap); the icon glyph
     inside still varies by the place's category, just not its color. */
  .leaflet-marker-pin{ display:flex; align-items:center; justify-content:center; }
  .leaflet-marker-pin .dot{
    width:40px; height:40px; border-radius:50%; background:var(--accent);
    border:3px solid var(--surface); box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center;
  }
  .leaflet-marker-pin svg{ width:26px; height:26px; stroke:var(--accent-ink); fill:none; stroke-width:2.1; }
  .leaflet-marker-pin.selected .dot{ border-color:var(--ink); }

  .status-banner{
    position:absolute; inset-inline:14px; top:14px; z-index:1005;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; font-size:14px; color:var(--ink-soft); box-shadow:var(--shadow-sm);
    display:flex; align-items:center; gap:8px;
  }
  .status-banner.error{ color:#9B3B3B; border-color:#D9AFAF; }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; animation:blink 1.4s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{opacity:.4;} 50%{opacity:1;} }

  #backdrop{
    position:fixed; inset:0; background:rgba(20,18,14,.38); opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:1024;
  }
  #backdrop.open{ opacity:1; pointer-events:auto; }

  #card{
    /* z-index sits above .topbar/.filters (1029-1030) on purpose: this is a
       modal-like popup, so once it's open it should never be visually covered
       by the sticky header/filter bar, even when its own content (and so the
       filter bar wrapping to extra rows above it) makes it tall. See the
       project notes for the bug this fixes. */
    position:fixed; inset-inline:0; bottom:0; z-index:1031;
    max-height:80vh; max-height:80dvh;
    background:var(--surface-raised);
    border-start-start-radius:20px; border-start-end-radius:20px;
    box-shadow:var(--shadow); transform:translateY(102%);
    transition:transform .32s cubic-bezier(.32,.72,0,1);
    display:flex; flex-direction:column; overscroll-behavior:contain;
  }
  #card.open{ transform:translateY(0); }
  .card-grip{ width:36px; height:4px; border-radius:99px; background:var(--line-strong); margin:10px auto 2px; flex:none; }
  .card-close{
    position:absolute; inset-inline-end:12px; top:14px; z-index:2;
    width:32px; height:32px; border-radius:50%; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .card-close svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; }
  /* The close button and grip sit outside .card-scroll on purpose, so they
     stay pinned in place no matter how long the place's content is - only
     .card-scroll itself scrolls (both on mobile and on desktop, see the
     min-width:860px block below), so the close button is always reachable. */
  .card-scroll{ overflow-y:auto; flex:1; min-height:0; padding-bottom:env(safe-area-inset-bottom,0px); }

  .card-empty{ padding:40px 24px 48px; text-align:center; color:var(--ink-faint); font-size:15px; line-height:1.6; }
  .card-empty svg{ width:30px; height:30px; stroke:var(--ink-faint); fill:none; stroke-width:1.5; margin-bottom:10px; }

  .card-body{ padding:18px 20px 28px; }
  .card-title{ font-size:25px; line-height:1.25; margin-bottom:2px; }
  .card-cats{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; margin-bottom:10px; }
  .card-cat-tag{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; padding:4px 9px; border-radius:999px; color:var(--tag-ink,#fff); }
  .card-cat-tag svg{ width:11px; height:11px; stroke:var(--tag-ink,#fff); fill:none; stroke-width:2; }

  .card-story-label{ display:flex; align-items:center; gap:7px; margin-top:18px; margin-bottom:8px; font-size:12.5px; letter-spacing:.04em; color:var(--ink-faint); text-transform:uppercase; }
  .card-host{ font-size:15px; color:var(--ink-soft); margin-bottom:6px; }
  .card-host b{ color:var(--ink); font-weight:600; }
  .card-story{ font-size:17px; line-height:1.75; color:var(--ink); }

  .card-meta{ margin-top:22px; display:flex; flex-direction:column; gap:11px; }
  .card-meta-row{ display:flex; align-items:flex-start; gap:10px; font-size:15px; }
  .card-meta-row svg{ width:17px; height:17px; flex:none; margin-top:1px; stroke:var(--ink-soft); fill:none; stroke-width:1.7; }
  .card-meta-label{ color:var(--ink-faint); font-size:12.5px; display:block; margin-bottom:1px; }
  .card-meta-val{ color:var(--ink); }
  .card-phone-link{ text-decoration:none; border-bottom:1px solid var(--line-strong); }

  .card-actions{ margin-top:20px; display:flex; flex-wrap:wrap; gap:9px; }
  .btn{ display:inline-flex; align-items:center; gap:7px; padding:12px 18px; border-radius:12px; font-size:15px; font-weight:600; text-decoration:none; border:1px solid transparent; }
  .btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-secondary{ background:var(--surface); border-color:var(--line-strong); color:var(--ink); }

  #intro-backdrop{
    position:fixed; inset:0; background:rgba(20,18,14,.5); z-index:1040;
    display:flex; align-items:flex-end; justify-content:center;
  }
  #intro-backdrop[hidden]{ display:none; }
  .intro-modal{
    width:100%; max-width:460px; background:var(--surface-raised);
    border-radius:20px 20px 0 0; padding:26px 24px 28px; box-shadow:var(--shadow);
    max-height:88vh; max-height:88dvh; overflow-y:auto;
  }
  @media (min-width:640px){ #intro-backdrop{ align-items:center; } .intro-modal{ border-radius:20px; } }
  .intro-title{ font-size:26px; margin-bottom:14px; }
  .intro-body{ font-size:16.5px; line-height:1.85; color:var(--ink-soft); white-space:pre-line; }
  .intro-cta{ margin-top:22px; width:100%; justify-content:center; padding:13px; }

  @media (min-width:860px){
    .filters{ top:63px; }
    #backdrop{ display:none; }
    #card{
      position:relative; inset:auto; transform:none !important; max-height:none;
      flex:0 0 380px; width:380px; border-radius:0; box-shadow:none; order:-1;
      border-inline-end:1px solid var(--line); display:flex; flex-direction:column;
    }
    .card-grip{ display:none; }
    #card .card-scroll{ overflow-y:auto; flex:1; }
    #intro-backdrop{ align-items:center; }
  }
</style>

      hostLabel:"מארח/ת", hoursLabel:"שעות פעילות", phoneLabel:"טלפון", directionsBtn:"איך מגיעים?", wazeBtn:"Waze", mapsBtn:"Google Maps",
      siteBtn:"אתר", instaBtn:"אינסטגרם", filterAria:"סינון לפי קטגוריה", loading:"טוען נתונים מהגיליונות…",
      loadError:"לא הצלחתי לטעון את הנתונים מהגיליון. ודאו שהגיליון משותף כ‑\"כל מי שיש לו את הקישור – צפייה\".",
      loaded:"מחובר לגיליונות · ",
      introDefaultBody:"רדו מהכביש הראשי, היכנסו פנימה, ולחצו על הנקודות במפה כדי לגלות מקומות, אנשים וסיפורים מתוך בוקעתא.",
      brandSubDefault:"מפת העסקים המקומיים, האנשים והנוף של בוקעתא" },
    ar:{ liveTag:"متصل بجداول Google", aboutTitle:"عن المسار", emptyState:"اختاروا نقطة على الخريطة للقاء القصة التي تقف وراءها.",
      hostLabel:"المضيف/ة", hoursLabel:"ساعات العمل", phoneLabel:"الهاتف", directionsBtn:"كيف نصل؟", wazeBtn:"Waze", mapsBtn:"خرائط جوجل",
      siteBtn:"الموقع الإلكتروني", instaBtn:"إنستغرام", filterAria:"تصفية حسب الفئة", loading:"جارٍ تحميل البيانات من الجداول…",
      loadError:"تعذّر تحميل البيانات من الجدول. تأكدوا أن الجدول مشترك كـ‑\"أي شخص لديه الرابط – مشاهدة\".",
      loaded:"متصل بالجداول · ",
      introDefaultBody:"انزلوا عن الطريق الرئيسي، ادخلوا إلى الداخل، واضغطوا على النقاط على الخريطة لاكتشاف أماكن وأشخاص وقصص من بقعاتا.",
      brandSubDefault:"خريطة الأعمال المحلية والناس ومناظر بقعاتا الطبيعية" },
    en:{ liveTag:"Connected to Google Sheets", aboutTitle:"About the Trail", emptyState:"Choose a point on the map to meet the story behind it.",
      hostLabel:"Host", hoursLabel:"Opening hours", phoneLabel:"Phone", directionsBtn:"Get directions", wazeBtn:"Waze", mapsBtn:"Google Maps",
      siteBtn:"Website", instaBtn:"Instagram", filterAria:"Filter by category", loading:"Loading data from the sheets…",
      loadError:"Couldn't load data from the sheet. Make sure the sheet is shared as \"Anyone with the link – Viewer\".",
      loaded:"Connected to sheets · ",
      introDefaultBody:"Step off the main road, come on in, and tap the points on the map to discover places, people and stories from Buq'ata.",
      brandSubDefault:"A map of Buq'ata's local businesses, people and landscape." }
  };

  // =========================================================================
  // 2. Google Sheets loader — no build step, reads live at page load
  // =========================================================================
  // Earlier versions used gviz's out:json endpoint, keyed by data.table.cols[].label.
  // That relies on Google's own guess about whether row 1 "looks like" a header
  // row, and with mostly-text columns (our case) that guess kept failing, so no
  // points ever showed. The Tel Aviv reference map (which is proven reliable in
  // production) sidesteps this entirely by reading out:csv instead - a CSV export
  // has no such guessing: row 1 is always just whatever text is actually there,
  // used directly as the header row. We do the same here.
  function parseCSV(text){
    var rows = [], row = [], field = "", inQuotes = false;
    for(var i = 0; i < text.length; i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\r'){ /* skip - CRLF handled via the \n below */ }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function fetchSheetRowsCSV(sheetName){
    var url = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(sheetName);
    return fetch(url).then(function(res){
      if(!res.ok) throw new Error("CSV HTTP " + res.status);
      return res.text();
    }).then(function(text){
      var table = parseCSV(text);
      if(!table.length) throw new Error("CSV: empty sheet");

      var labels = table[0].map(function(v){ return (v || "").trim(); });
      var dataRows = table.slice(1);

      var rows = dataRows.map(function(r){
        var obj = {};
        labels.forEach(function(key, i){
          if(!key) return;
          obj[key] = r[i] !== undefined ? r[i] : "";
        });
        return obj;
      });
      return rows;
    });
  }

  // Fallback path, used only if the CSV request above fails (e.g. a network/CORS
  // quirk specific to that endpoint). Reads the same data via gviz's JSON output,
  // with a self-recovery step for Google's header-row auto-detection: when most
  // columns are text (our case), Google sometimes fails to recognize row 1 as a
  // header row, so data.table.cols[].label comes back empty - in that case we
  // read the header names straight out of the sheet's own first data row instead.
  function fetchSheetRowsJSON(sheetName){
    var url = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID + "/gviz/tq?tqx=out:json&headers=1&sheet=" + encodeURIComponent(sheetName);
    return fetch(url).then(function(res){
      if(!res.ok) throw new Error("JSON HTTP " + res.status);
      return res.text();
    }).then(function(text){
      var m = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
      if(!m) throw new Error("JSON: unexpected response (sheet likely not public)");
      var data = JSON.parse(m[1]);
      if(!data.table || !data.table.cols) throw new Error("JSON: empty table");

      var dataRows = data.table.rows || [];
      var labels = data.table.cols.map(function(c){ return (c.label || "").trim(); });

      var looksEmpty = labels.filter(Boolean).length < 2;
      if(looksEmpty && dataRows.length){
        labels = (dataRows[0].c || []).map(function(cell){
          return (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v).trim() : "";
        });
        dataRows = dataRows.slice(1);
      }

      var rows = dataRows.map(function(r){
        var obj = {};
        (r.c || []).forEach(function(cell, i){
          var key = labels[i];
          if(!key) return;
          obj[key] = cell ? cell.v : "";
        });
        return obj;
      });
      return rows;
    });
  }

  function fetchSheetRows(sheetName){
    return fetchSheetRowsCSV(sheetName).catch(function(csvErr){
      console.warn("Buqata map: CSV fetch failed, falling back to JSON", sheetName, csvErr);
      return fetchSheetRowsJSON(sheetName).catch(function(jsonErr){
        throw new Error("CSV: " + csvErr.message + " | JSON: " + jsonErr.message);
      });
    });
  }

  function truthy(v){
    if(v === true) return true;
    if(typeof v === "string") return v.trim().toUpperCase() === "TRUE";
    return false;
  }
  function num(v){ var n = parseFloat(v); return isNaN(n) ? null : n; }
  function str(v){ return (v === null || v === undefined) ? "" : String(v).trim(); }

  // Location: prefer a single "מיקום" column in "lat, lng" format (the same
  // format you get when copying a location straight out of Google Maps, and
  // the format the reference map uses) - falls back to the older two separate
  // columns (קו רוחב (lat) / קו אורך (lng)) so nothing breaks if the sheet
  // hasn't been switched over to the combined column yet.
  function parseLocCol(r){
    var s = str(r["מיקום"]);
    if(!s) return null;
    var parts = s.split(",");
    if(parts.length < 2) return null;
    var lat = num(parts[0]), lng = num(parts[1]);
    if(lat === null || lng === null) return null;
    return { lat: lat, lng: lng };
  }
  function locLat(r){ var loc = parseLocCol(r); return loc ? loc.lat : num(r["קו רוחב (lat)"]); }
  function locLng(r){ var loc = parseLocCol(r); return loc ? loc.lng : num(r["קו אורך (lng)"]); }

  function loadAll(){
    return Promise.all([
      fetchSheetRows(SHEET_NAMES.places),
      fetchSheetRows(SHEET_NAMES.categories),
      fetchSheetRows(SHEET_NAMES.settings)
    ]).then(function(results){
      var placeRows = results[0], catRows = results[1], settingRows = results[2];

      var CATEGORIES = catRows
        .filter(function(r){ return str(r["מזהה (לא לשנות)"]) && !str(r["מזהה (לא לשנות)"]).includes("הערה"); })
        .map(function(r, i){
          return {
            id: str(r["מזהה (לא לשנות)"]),
            name: { he: str(r["שם – עברית"]), ar: str(r["שם – ערבית"]), en: str(r["שם – אנגלית"]) },
            color: r["צבע (הקס)"] ? ("#" + str(r["צבע (הקס)"]).replace(/^#/,"")) : FALLBACK_COLORS[i % FALLBACK_COLORS.length],
            icon: ICONS[str(r["אייקון"])] ? str(r["אייקון"]) : "sparkle",
            order: num(r["סדר תצוגה"]) || i
          };
        })
        .sort(function(a,b){ return a.order - b.order; });

      var PLACES = placeRows
        .filter(function(r){ return str(r["ID"]) && truthy(r["פעיל"]); })
        .map(function(r){
          var cats = [r["קטגוריה א׳"], r["קטגוריה ב׳"], r["קטגוריה ג׳"]].map(str).filter(Boolean);
          return {
            id: str(r["ID"]),
            name: { he: str(r["שם – עברית"]), ar: str(r["שם – ערבית"]), en: str(r["שם – אנגלית"]) },
            host: { he: str(r["מארח/ת – עברית"]), ar: str(r["מארח/ת – ערבית"]), en: str(r["מארח/ת – אנגלית"]) },
            story: { he: str(r["הסיפור – עברית"]), ar: str(r["הסיפור – ערבית"]), en: str(r["הסיפור – אנגלית"]) },
            hours: { he: str(r["שעות פתיחה – עברית"]), ar: str(r["שעות פתיחה – ערבית"]), en: str(r["שעות פתיחה – אנגלית"]) },
            cats: cats,
            lat: locLat(r),
            lng: locLng(r),
            phone: str(r["טלפון למארח"]),
            website: str(r["קישור לאתר"]),
            instagram: str(r["קישור לאינסטגרם"]),
            facebook: str(r["קישור לפייסבוק"])
          };
        })
        .filter(function(p){ return p.lat !== null && p.lng !== null; });

      var SETTINGS = {};
      settingRows.forEach(function(r){
        var key = str(r["מפתח (לא לשנות)"]);
        if(!key) return;
        SETTINGS[key] = { he: str(r["עברית"]), ar: str(r["ערבית"]), en: str(r["אנגלית"]) };
      });

      return { CATEGORIES: CATEGORIES, PLACES: PLACES, SETTINGS: SETTINGS };
    });
  }

  // =========================================================================
  // 3. App state + rendering
  // =========================================================================
  var state = { lang:"he", activeCats:new Set(), selectedId:null, data:null, map:null, markers:{} };

  function t(key){ return STRINGS[state.lang][key]; }
  function loc(obj){ return (obj && (obj[state.lang] || obj.he)) || ""; }
  function iconSvg(iconKey, cls, style){
    var path = ICONS[iconKey] || ICONS.sparkle;
    return '<svg class="'+(cls||"")+'" width="24" height="24" viewBox="0 0 24 24"'+(style?' style="'+style+'"':'')+'>'+path+'</svg>';
  }

  var elApp = document.getElementById("app");
  var elFilters = document.getElementById("filters");
  var elCard = document.getElementById("card");
  var elCardEmpty = document.getElementById("card-empty");
  var elCardPlace = document.getElementById("card-place");
  var elBackdrop = document.getElementById("backdrop");
  var elIntroBackdrop = document.getElementById("intro-backdrop");
  var elStatusBanner = document.getElementById("status-banner");
  var elStatusText = document.getElementById("status-text");
  var elLangToggle = document.getElementById("lang-toggle");
  var elLangMenu = document.getElementById("lang-menu");

  function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function safeSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }

  function renderFilters(){
    if(!state.data) return;
    elFilters.setAttribute("aria-label", t("filterAria"));
    var html = "";
    state.data.CATEGORIES.forEach(function(c){
      var pressed = state.activeCats.has(c.id);
      html += '<button type="button" class="chip" data-cat="'+c.id+'" style="--chip-color:'+c.color+';--chip-ink:'+textColorFor(c.color)+'" aria-pressed="'+pressed+'">'
        + iconSvg(c.icon) + '<span>' + loc(c.name) + '</span></button>';
    });
    elFilters.innerHTML = html;
    Array.prototype.forEach.call(elFilters.querySelectorAll(".chip"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-cat");
        if(state.activeCats.has(id)) state.activeCats.delete(id); else state.activeCats.add(id);
        renderFilters();
        renderMarkers();
      });
    });
  }

  function catById(id){ return state.data.CATEGORIES.filter(function(c){ return c.id===id; })[0]; }

  function placeVisible(p){
    if(state.activeCats.size === 0) return true;
    return p.cats.some(function(c){ return state.activeCats.has(c); });
  }

  function renderMarkers(){
    if(!state.map || !state.data) return;
    Object.keys(state.markers).forEach(function(id){ state.map.removeLayer(state.markers[id]); });
    state.markers = {};
    state.data.PLACES.forEach(function(p){
      if(!placeVisible(p)) return;
      var mainCat = catById(p.cats[0]) || state.data.CATEGORIES[0];
      if(!mainCat) return;
      // The marker's color is one uniform accent (set in CSS) regardless of
      // category now - only the icon glyph inside still varies by category.
      var html = '<div class="leaflet-marker-pin'+(state.selectedId===p.id?" selected":"")+'">'
        + '<div class="dot">' + iconSvg(mainCat.icon) + '</div></div>';
      var icon = L.divIcon({ html: html, className:"", iconSize:[46,46], iconAnchor:[23,23] });
      var marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(state.map);
      marker.on("click", function(){ openPlace(p.id); });
      state.markers[p.id] = marker;
    });
  }

  // Auto-fit the initial view to whatever places are actually in the sheet,
  // so the starting zoom/center always shows every point in one glance -
  // no manual coordinates to maintain, this just recomputes itself from
  // the same lat/lng values the markers use.
  function fitMapToPlaces(){
    if(!state.map || !state.data) return;
    var pts = state.data.PLACES
      .filter(function(p){ return typeof p.lat === "number" && typeof p.lng === "number"; })
      .map(function(p){ return [p.lat, p.lng]; });
    if(pts.length === 0){
      state.map.setView(MAP_CENTER, MAP_ZOOM);
    } else if(pts.length === 1){
      state.map.setView(pts[0], MAP_ZOOM);
    } else {
      // maxZoom matches the gray basemap's native max zoom (16) - see Boot.
      state.map.fitBounds(L.latLngBounds(pts), { padding: [36, 36], maxZoom: 16 });
    }
  }

  function metaRow(iconId,label,valueHtml){
    if(!valueHtml) return "";
    return '<div class="card-meta-row">' + iconSvg(iconId) + '<div><span class="card-meta-label">'+label+'</span><span class="card-meta-val">'+valueHtml+'</span></div></div>';
  }

  function renderPlaceCard(p){
    var catsHtml = p.cats.map(function(cid){
      var c = catById(cid); if(!c) return "";
      return '<span class="card-cat-tag" style="background:'+c.color+';--tag-ink:'+textColorFor(c.color)+'">'+iconSvg(c.icon)+loc(c.name)+'</span>';
    }).join("");
    var hostHtml = loc(p.host) ? '<div class="card-host">'+t("hostLabel")+': <b>'+loc(p.host)+'</b></div>' : "";
    var actions = "";
    if(p.lat && p.lng){
      var q = p.lat+","+p.lng;
      actions += '<a class="btn btn-primary" target="_blank" rel="noopener" href="https://waze.com/ul?ll='+q+'&navigate=yes">'+iconSvg("sparkle")+t("wazeBtn")+'</a>';
      actions += '<a class="btn btn-secondary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+q+'">'+iconSvg("sparkle")+t("mapsBtn")+'</a>';
    }
    if(p.website){ actions += '<a class="btn btn-secondary" target="_blank" rel="noopener" href="'+p.website+'">'+iconSvg("cup")+t("siteBtn")+'</a>'; }
    if(p.instagram){ actions += '<a class="btn btn-secondary" target="_blank" rel="noopener" href="https://instagram.com/'+p.instagram+'">'+iconSvg("cup")+t("instaBtn")+'</a>'; }
    var phoneVal = p.phone ? '<a class="card-phone-link" href="tel:'+p.phone.replace(/[^0-9+]/g,"")+'">'+p.phone+'</a>' : "";

    elCardPlace.innerHTML =
      '<h3 class="card-title">'+loc(p.name)+'</h3>'
      + '<div class="card-cats">'+catsHtml+'</div>'
      + '<div class="card-story-label"><span>'+ (state.lang==="he"?"על המארח/ת":state.lang==="ar"?"عن المضيف/ة":"About the host") +'</span></div>'
      + hostHtml
      + '<p class="card-story">'+loc(p.story)+'</p>'
      + '<div class="card-meta">'+ metaRow("bed", t("hoursLabel"), loc(p.hours)) + metaRow("house-heart", t("phoneLabel"), phoneVal) + '</div>'
      + '<div class="card-actions">'+actions+'</div>';
  }

  function openPlace(id){
    var p = state.data.PLACES.filter(function(x){ return x.id===id; })[0];
    if(!p) return;
    state.selectedId = id;
    renderPlaceCard(p);
    elCardEmpty.hidden = true; elCardPlace.hidden = false;
    elCard.classList.add("open"); elBackdrop.classList.add("open");
    renderMarkers();
    if(state.map) state.map.panTo([p.lat, p.lng]);
    elCard.scrollTop = 0;
  }
  function closePlace(){
    state.selectedId = null;
    elCard.classList.remove("open"); elBackdrop.classList.remove("open");
    elCardEmpty.hidden = false; elCardPlace.hidden = true;
    renderMarkers();
  }

  function applySettingsText(){
    if(!state.data) return;
    var s = state.data.SETTINGS;
    if(s.brand_title) document.getElementById("brand-title-el").textContent = loc(s.brand_title);
    if(s.brand_subtitle) document.getElementById("brand-sub-el").textContent = loc(s.brand_subtitle);
    if(s.intro_title) document.getElementById("intro-title-el").textContent = loc(s.intro_title);
    if(s.intro_body) document.getElementById("intro-body-el").textContent = loc(s.intro_body);
    if(s.intro_cta) document.getElementById("intro-cta").textContent = loc(s.intro_cta);
  }

  function applyStaticText(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function(el){
      var key = el.getAttribute("data-t");
      var val = STRINGS[state.lang][key];
      if(val !== undefined) el.textContent = val;
    });
    applySettingsText();
  }

  function setLang(lang){
    state.lang = lang;
    var dir = lang === "en" ? "ltr" : "rtl";
    elApp.setAttribute("dir", dir); elApp.setAttribute("lang", lang);
    Array.prototype.forEach.call(document.querySelectorAll(".lang-switch button[data-lang]"), function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true":"false");
    });
    applyStaticText();
    // applySettingsText() (called from applyStaticText) only touches the
    // intro text and brand subtitle once real sheet data has loaded - if
    // someone switches language while still on the built-in fallback text
    // (data not loaded yet, or failed), keep that fallback in sync with the
    // chosen language too.
    if(!state.data){
      document.getElementById("intro-body-el").textContent = t("introDefaultBody");
      document.getElementById("brand-sub-el").textContent = t("brandSubDefault");
    }
    renderFilters();
    renderMarkers();
    if(state.selectedId){
      var p = state.data.PLACES.filter(function(x){ return x.id===state.selectedId; })[0];
      if(p) renderPlaceCard(p);
    }
    safeSet("buqata_lang_live", lang);
  }

  function showIntro(){ elIntroBackdrop.hidden = false; }
  function hideIntro(){ elIntroBackdrop.hidden = true; safeSet("buqata_intro_seen_live","1"); }

  document.getElementById("about-btn").addEventListener("click", showIntro);
  document.getElementById("intro-cta").addEventListener("click", hideIntro);
  document.getElementById("card-close-btn").addEventListener("click", closePlace);
  elBackdrop.addEventListener("click", closePlace);

  // Language switcher: collapsed under a single globe icon; clicking it opens
  // a small menu with the three language options, picking one applies the
  // language and closes the menu again.
  function openLangMenu(){ elLangMenu.hidden = false; elLangToggle.setAttribute("aria-expanded","true"); }
  function closeLangMenu(){ elLangMenu.hidden = true; elLangToggle.setAttribute("aria-expanded","false"); }
  elLangToggle.addEventListener("click", function(e){
    e.stopPropagation();
    if(elLangMenu.hidden) openLangMenu(); else closeLangMenu();
  });
  document.addEventListener("click", function(e){
    if(!elLangMenu.hidden && e.target !== elLangToggle && !elLangMenu.contains(e.target)){
      closeLangMenu();
    }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".lang-switch button[data-lang]"), function(btn){
    btn.addEventListener("click", function(){ setLang(btn.getAttribute("data-lang")); closeLangMenu(); });
  });

  // Extra escape hatches for the welcome screen, in case the CTA button click
  // doesn't land for some reason (a stuck welcome screen blocks the entire
  // page, since it sits above everything else) - clicking the dark area
  // around the card, or pressing Escape, both dismiss it too.
  elIntroBackdrop.addEventListener("click", function(e){
    if(e.target === elIntroBackdrop) hideIntro();
  });
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(!elIntroBackdrop.hidden){ hideIntro(); return; }
    if(!elLangMenu.hidden){ closeLangMenu(); return; }
    if(elCard.classList.contains("open")){ closePlace(); }
  });

  // =========================================================================
  // 4. Boot
  // =========================================================================
  state.map = L.map("leaflet-map", { zoomControl:true }).setView(MAP_CENTER, MAP_ZOOM);
  // Tile source, take 3: switched from Esri's colorful World Street Map to
  // Esri's "Light Gray Canvas" basemap (same host/account as before, which
  // we already know works with no key/signup - see the history above) for a
  // simpler, neutral-gray background that doesn't compete with the colored
  // place markers. It's two layers stacked: the plain gray base, plus a
  // reference layer with light labels/roads on top for orientation.
  var ESRI_GRAY = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
  var ESRI_ATTRIBUTION = 'Tiles &copy; <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a> &mdash; Esri, HERE, Garmin, FAO, NOAA, USGS';
  L.tileLayer(ESRI_GRAY + "World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 16, attribution: ESRI_ATTRIBUTION
  }).addTo(state.map);
  L.tileLayer(ESRI_GRAY + "World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 16, maxNativeZoom: 16
  }).addTo(state.map);

  var savedLang = safeGet("buqata_lang_live") || "he";
  state.lang = savedLang;
  elApp.setAttribute("dir", savedLang==="en"?"ltr":"rtl");
  elApp.setAttribute("lang", savedLang);
  Array.prototype.forEach.call(document.querySelectorAll(".lang-switch button[data-lang]"), function(btn){
    btn.setAttribute("aria-pressed", btn.getAttribute("data-lang")===savedLang ? "true":"false");
  });
  elStatusText.textContent = t("loading");

  // The welcome popup must not depend on the Google Sheets fetch succeeding -
  // a real visitor on a flaky mobile connection (this is exactly the QR-code-
  // in-the-field use case) could easily hit a slow or failed request, and the
  // popup used to only show inside the success branch below, so it silently
  // never appeared for them. So: show it right away with a sensible built-in
  // default message, independent of the data load. If the sheet does load
  // successfully, applyStaticText() (below) still overwrites it with the
  // custom text from the Settings tab, same as before - this only changes
  // when the popup is guaranteed to appear, not what it can say. The brand
  // subtitle follows the same pattern, for the same reason.
  document.getElementById("intro-body-el").textContent = t("introDefaultBody");
  document.getElementById("brand-sub-el").textContent = t("brandSubDefault");
  if(!safeGet("buqata_intro_seen_live")){ showIntro(); }

  loadAll().then(function(data){
    state.data = data;
    applyStaticText();
    renderFilters();
    renderMarkers();
    fitMapToPlaces();
    elStatusBanner.classList.remove("error");
    // On success we just hide the loading banner - no "connected to sheets"
    // message shown to visitors. It still shows briefly while loading (see
    // "loading" text above), and the error banner below is unchanged, since
    // that one is genuinely useful for spotting a real problem.
    elStatusBanner.style.display = "none";
  }).catch(function(err){
    console.error("Buqata map: failed to load sheet data", err);
    elStatusBanner.classList.add("error");
    // Show the raw error too (not just the friendly message) so a screenshot
    // of the banner is enough to diagnose the real cause remotely, without
    // needing to open the browser console.
    elStatusText.textContent = t("loadError") + " [" + (err && err.message ? err.message : err) + "]";
  });

})();
</script>
</body>
</html>
